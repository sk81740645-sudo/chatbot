<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BaatAI - AI Assistant | Study, Coding, Stories & Ideas</title>

<meta name="description"
      content="BaatAI एक AI Assistant है जो study, coding, stories, ideas और रोज़मर्रा के सवालों में आपकी मदद करता है.">

<meta name="robots" content="index, follow">

<link rel="canonical"
      href="https://baatai-static-web.onrender.com/">

<link rel="icon"
      type="image/png"
      href="/baatai-logo.png?v=3">

<link rel="shortcut icon"
      type="image/png"
      href="/baatai-logo.png?v=3">

<link rel="apple-touch-icon"
      href="/baatai-logo.png">


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#020817;
    color:#fff;
    overflow:hidden;
}


/* =========================
   BACKGROUND
========================= */

#bgVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    pointer-events:none;
}

.videoOverlay{
    position:fixed;
    inset:0;
    background:
        linear-gradient(
            135deg,
            rgba(0,5,18,.94),
            rgba(0,15,30,.86)
        );
    z-index:-2;
    pointer-events:none;
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    position:relative;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:270px;
    height:100%;
    flex-shrink:0;

    background:rgba(3,12,28,.96);

    border-right:
        1px solid rgba(0,220,255,.16);

    padding:16px;

    display:flex;
    flex-direction:column;

    position:relative;
    z-index:50;
}


/* =========================
   BRAND
========================= */

.brand{
    display:flex;
    align-items:center;
    gap:12px;

    padding:7px 3px 20px;
}

.brandLogo{
    width:48px;
    height:48px;

    object-fit:cover;

    border-radius:14px;

    box-shadow:
        0 0 22px rgba(0,220,255,.25);
}

.brandName{
    font-size:21px;
    font-weight:800;
}

.brandSub{
    margin-top:3px;
    font-size:12px;
    color:#65e7ff;
}


/* =========================
   SIDEBAR BUTTONS
========================= */

.sideBtn{
    width:100%;
    min-height:46px;

    border:
        1px solid rgba(0,220,255,.14);

    border-radius:12px;

    background:
        rgba(255,255,255,.045);

    color:#fff;

    padding:10px 13px;

    margin-bottom:9px;

    text-align:left;

    cursor:pointer;

    font-size:14px;

    transition:.2s;
}

.sideBtn:hover{
    background:
        rgba(0,220,255,.10);

    border-color:
        rgba(0,220,255,.32);
}

.sideBtn.primary{
    background:
        linear-gradient(
            135deg,
            rgba(0,210,255,.20),
            rgba(0,120,255,.15)
        );
}

.sideIcon{
    margin-right:8px;
}


/* =========================
   HISTORY TITLE
========================= */

.historyTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin:
        14px 4px 9px;

    color:#6ceaff;

    font-size:12px;
    font-weight:bold;

    letter-spacing:.6px;
}

.historyCount{
    min-width:20px;
    height:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:
        rgba(0,220,255,.12);

    color:#72eaff;

    font-size:10px;
}


/* =========================
   HISTORY
========================= */

.history{
    flex:1;
    overflow-y:auto;

    padding-right:3px;
}

.history::-webkit-scrollbar{
    width:4px;
}

.history::-webkit-scrollbar-thumb{
    background:#17566b;
    border-radius:10px;
}


/* HISTORY ITEM */

.historyItem{
    width:100%;

    display:flex;
    align-items:center;

    gap:8px;

    padding:11px 10px;

    margin-bottom:6px;

    border-radius:10px;

    color:#cbd9e7;

    font-size:13px;

    cursor:pointer;

    transition:.2s;
}

.historyItem:hover{
    background:
        rgba(0,220,255,.09);

    color:#fff;
}

.historyItem.active{
    background:
        rgba(0,220,255,.13);

    color:#fff;

    border-left:
        2px solid #36dfff;
}

.historyIcon{
    flex-shrink:0;
}

.historyText{
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}


/* EMPTY HISTORY */

.emptyHistory{
    padding:15px 7px;

    text-align:center;

    color:#657a8e;

    font-size:12px;

    line-height:1.5;
}


/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    height:100%;

    display:flex;
    flex-direction:column;

    position:relative;
}


/* =========================
   HEADER
========================= */

.header{
    height:70px;
    min-height:70px;

    display:flex;
    align-items:center;

    padding:
        10px 18px;

    background:
        rgba(1,8,20,.78);

    border-bottom:
        1px solid rgba(0,220,255,.12);

    backdrop-filter:blur(12px);

    z-index:20;
}

.headerLeft{
    display:flex;
    align-items:center;
    gap:10px;
}

.menuBtn{
    display:none;

    width:42px;
    height:42px;

    border:0;
    border-radius:12px;

    background:
        rgba(255,255,255,.07);

    color:#fff;

    font-size:20px;

    cursor:pointer;
}

.headerLogo{
    width:38px;
    height:38px;

    object-fit:cover;

    border-radius:11px;
}

.headerTitle{
    font-size:17px;
    font-weight:700;
}

.headerStatus{
    margin-top:2px;

    color:#67e9ff;

    font-size:11px;
}

.headerStatus::before{
    content:"";

    display:inline-block;

    width:7px;
    height:7px;

    margin-right:5px;

    border-radius:50%;

    background:#20e890;

    box-shadow:
        0 0 8px #20e890;
}


/* =========================
   CHAT AREA
========================= */

.chatArea{
    flex:1;

    overflow-y:auto;

    padding:
        28px 20px 150px;

    scroll-behavior:smooth;
}

.chatArea::-webkit-scrollbar{
    width:5px;
}

.chatArea::-webkit-scrollbar-thumb{
    background:#16495b;
    border-radius:10px;
}

.chatContainer{
    max-width:900px;
    margin:auto;
}


/* =========================
   WELCOME
========================= */

.welcome{
    min-height:
        calc(100vh - 240px);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.welcomeBox{
    width:100%;
    max-width:650px;
    padding:20px;
}

.welcomeLogo{
    width:105px;
    height:105px;

    object-fit:cover;

    border-radius:28px;

    margin-bottom:18px;

    box-shadow:
        0 0 30px rgba(0,220,255,.20);
}

.welcome h1{
    font-size:34px;
    margin-bottom:10px;
}

.welcome h1 span{
    color:#48e7ff;
}

.welcome p{
    color:#a9bacb;

    line-height:1.6;

    font-size:14px;
}


/* =========================
   SUGGESTIONS
========================= */

.suggestions{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    margin-top:25px;
}

.suggestion{
    padding:13px;

    border:
        1px solid rgba(0,220,255,.12);

    background:
        rgba(255,255,255,.04);

    border-radius:12px;

    color:#dcefff;

    text-align:left;

    font-size:13px;

    cursor:pointer;

    transition:.2s;
}

.suggestion:hover{
    background:
        rgba(0,220,255,.10);

    border-color:
        rgba(0,220,255,.30);
}


/* =========================
   MESSAGE
========================= */

.messageRow{
    display:flex;

    gap:11px;

    margin-bottom:22px;
}

.messageRow.user{
    justify-content:flex-end;
}

.messageAvatar{
    width:34px;
    height:34px;

    min-width:34px;

    object-fit:cover;

    border-radius:10px;
}

.aiAvatar{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#0b2637;

    font-size:17px;
}

.messageContent{
    max-width:
        min(78%,700px);
}

.messageBubble{
    padding:
        13px 15px;

    border-radius:15px;

    font-size:14px;

    line-height:1.6;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}

.messageRow.ai .messageBubble{
    background:
        rgba(7,23,39,.92);

    border:
        1px solid rgba(0,220,255,.08);
}

.messageRow.user .messageBubble{
    background:
        linear-gradient(
            135deg,
            #075d77,
            #073e65
        );

    border:
        1px solid rgba(0,220,255,.15);
}

.messageImage{
    display:block;

    max-width:300px;
    max-height:300px;

    margin-top:8px;

    border-radius:12px;
}

.messageTime{
    margin-top:5px;

    color:#63778c;

    font-size:10px;
}


/* =========================
   CODE
========================= */

.messageBubble pre{
    overflow-x:auto;

    padding:12px;

    margin:10px 0;

    border-radius:10px;

    background:#020811;
}

.messageBubble code{
    font-family:
        Consolas,
        monospace;
}


/* =========================
   TYPING
========================= */

.typing{
    display:flex;
    gap:5px;
    padding:3px;
}

.typing span{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#4edfff;

    animation:
        typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-3px);
    }

}


/* =========================
   INPUT AREA
========================= */

.inputArea{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:
        15px 20px 20px;

    background:
        linear-gradient(
            to top,
            rgba(1,7,18,.99),
            rgba(1,7,18,.88),
            transparent
        );

    z-index:15;
}

.inputBox{
    max-width:900px;
    margin:auto;
}

.composer{
    min-height:60px;

    display:flex;
    align-items:flex-end;

    padding:8px;

    border:
        1px solid rgba(0,220,255,.20);

    border-radius:18px;

    background:
        rgba(5,18,32,.96);

    box-shadow:
        0 10px 40px rgba(0,0,0,.35);
}

#messageInput{
    flex:1;

    min-width:0;

    max-height:130px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    padding:11px;

    font-family:inherit;

    font-size:14px;

    line-height:1.5;
}

#messageInput::placeholder{
    color:#70869a;
}

.composerButtons{
    display:flex;
    align-items:center;
    gap:6px;
}

.iconBtn{
    width:42px;
    height:42px;

    border:0;

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    color:#d8f7ff;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.iconBtn:hover{
    background:
        rgba(0,220,255,.12);
}

.iconBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.iconBtn svg{
    width:21px;
    height:21px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.8;
}

.sendBtn{
    background:
        linear-gradient(
            135deg,
            #00c9ed,
            #0879d8
        );
}

.sendBtn:hover{
    filter:brightness(1.12);
}


/* =========================
   IMAGE PREVIEW
========================= */

.imagePreview{
    display:none;

    position:relative;

    padding:8px;

    margin-bottom:7px;

    border:
        1px solid rgba(0,220,255,.15);

    border-radius:13px;

    background:
        rgba(5,18,32,.95);
}

.imagePreview.show{
    display:block;
}

.imagePreview img{
    width:70px;
    height:70px;

    object-fit:cover;

    border-radius:10px;
}

.removeImage{
    position:absolute;

    left:67px;
    top:2px;

    width:22px;
    height:22px;

    border:0;

    border-radius:50%;

    background:#e23a4e;

    color:#fff;

    cursor:pointer;
}


/* =========================
   MIC
========================= */

.micBtn.listening{
    background:#d9294b;

    box-shadow:
        0 0 18px rgba(217,41,75,.4);
}


/* =========================
   LIGHT MODE
========================= */

body.light{
    background:#eef7fb;
    color:#102033;
}

body.light .sidebar{
    background:
        rgba(245,252,255,.98);

    border-color:#d5e7ee;
}

body.light .brandName,
body.light .headerTitle{
    color:#102033;
}

body.light .sideBtn{
    color:#183047;

    background:#fff;

    border-color:#d8e8ee;
}

body.light .historyItem{
    color:#476075;
}

body.light .historyItem:hover,
body.light .historyItem.active{
    color:#183047;

    background:#e5f5fa;
}

body.light .header{
    background:
        rgba(255,255,255,.92);

    border-color:#d5e7ee;
}

body.light .chatArea{
    background:#eef7fb;
}

body.light .messageRow.ai .messageBubble{
    color:#172b3e;

    background:#fff;

    border-color:#dbeaf0;
}

body.light .inputArea{
    background:
        linear-gradient(
            to top,
            rgba(238,247,251,.99),
            rgba(238,247,251,.85),
            transparent
        );
}

body.light .composer{
    background:#fff;

    border-color:#cfe3eb;
}

body.light #messageInput{
    color:#14283a;
}

body.light .suggestion{
    color:#183047;

    background:#fff;

    border-color:#d8e8ee;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .sidebar{
        position:fixed;

        left:-285px;

        top:0;
        bottom:0;

        z-index:80;

        transition:.25s;

        box-shadow:
            15px 0 40px rgba(0,0,0,.35);
    }

    .sidebar.open{
        left:0;
    }

    .menuBtn{
        display:block;
    }

    .inputArea{
        left:0;

        padding:
            10px 10px 13px;
    }

    .chatArea{
        padding:
            20px 12px 125px;
    }

    .header{
        padding:
            9px 11px;
    }

    .welcome h1{
        font-size:27px;
    }

    .welcomeLogo{
        width:85px;
        height:85px;
    }

    .messageContent{
        max-width:87%;
    }

    .messageBubble{
        font-size:13px;
    }

    .headerTitle{
        font-size:15px;
    }

    .suggestions{
        grid-template-columns:1fr;
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:430px){

    .composer{
        border-radius:15px;
    }

    .iconBtn{
        width:38px;
        height:38px;
    }

    .iconBtn svg{
        width:19px;
        height:19px;
    }

    #messageInput{
        font-size:13px;
        padding:
            9px 6px;
    }

}

</style>
</head>


<body>


<!-- =========================
     BACKGROUND VIDEO
========================= -->

<video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
>

    <source
        src="/background.mp4"
        type="video/mp4"
    >

</video>

<div class="videoOverlay"></div>



<div class="app">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <!-- BRAND -->

        <div class="brand">

            <img
                src="/baatai-logo.png"
                class="brandLogo"
                alt="BaatAI Logo"
            >

            <div>

                <div class="brandName">

                <div class="brandSub">

                </div>

            </div>

        </div>


        <!-- NEW CHAT -->

        <button

    <!-- =========================

                </button>


                <img

                >


                <div>

                    </div>

        <!-- =========================

                    <img

                <div class="composer">

                    <div class="composerButtons">

                                <path
                                    d="M5 11a7 7 0 0 0 14 0"

                                <path

                                <path
                                    d="M8 21h8"

                            </svg>

                        <button

                            type="button"

                            <svg

                            >

                                <path
                                    d="M3 20L21 12 3 4l3 7 9 1-9 1z"
                                ></path>

                            </svg>

                        </button>


                    </div>

                </div>


                <!-- HIDDEN IMAGE INPUT -->

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                >


            </div>

        </div>


    </main>

</div>



<script>

/* =====================================================
   BAATAI
   NO LOGIN / NO SIGNUP
   LOCAL CHAT HISTORY
===================================================== */


/* =========================
   API
========================= */

const API = "";


/* =========================
   STORAGE
========================= */

const CHATS_KEY =
    "baatai-local-chats-v2";

const THEME_KEY =
    "baatai-theme";


/* =========================
   VARIABLES
========================= */

let currentChatId = null;

let currentImage = null;

let isSending = false;

let recognition = null;

let isListening = false;


/* =========================
   ELEMENTS
========================= */

const sidebar =
    document.getElementById("sidebar");

const menuBtn =
    document.getElementById("menuBtn");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const previewImage =
    document.getElementById("previewImage");

const removeImage =
    document.getElementById("removeImage");

const micBtn =
    document.getElementById("micBtn");

const chatArea =
    document.getElementById("chatArea");

const chatContainer =
    document.getElementById("chatContainer");

const history =
    document.getElementById("history");

const historyCount =
    document.getElementById("historyCount");

const newChatBtn =
    document.getElementById("newChatBtn");

const clearHistoryBtn =
    document.getElementById("clearHistoryBtn");

const themeBtn =
    document.getElementById("themeBtn");

const themeIcon =
    document.getElementById("themeIcon");

const themeText =
    document.getElementById("themeText");


/* =========================
   GET CHATS
========================= */

function getChats(){

    try{

        const saved =
            localStorage.getItem(
                CHATS_KEY
            );

        if(!saved){
            return [];
        }

        const chats =
            JSON.parse(saved);

        return Array.isArray(chats)
            ? chats
            : [];

    }catch(error){

        console.error(
            "History read error:",
            error
        );

        return [];

    }

}


/* =========================
   SAVE CHATS
========================= */

function saveChats(chats){

    try{

        localStorage.setItem(
            CHATS_KEY,
            JSON.stringify(chats)
        );

        return true;

    }catch(error){

        console.error(
            "History save error:",
            error
        );

        alert(
            "Chat history save नहीं हो पाई। Browser storage full हो सकता है।"
        );

        return false;

    }

}


/* =========================
   CREATE CHAT
========================= */

function createChat(title = "New Chat"){

    const chats =
        getChats();


    const chat = {

        id:
            Date.now().toString() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2,9),

        title:
            title || "New Chat",

        messages:[],

        createdAt:
            Date.now(),

        updatedAt:
            Date.now()

    };


    chats.unshift(chat);

    saveChats(chats);


    return chat;

}


/* =========================
   CURRENT CHAT
========================= */

function getCurrentChat(){

    if(!currentChatId){
        return null;
    }


    const chats =
        getChats();


    return chats.find(
        chat =>
            chat.id ===
            currentChatId
    ) || null;

}


/* =========================
   UPDATE CHAT
========================= */

function updateChat(chat){

    const chats =
        getChats();


    const index =
        chats.findIndex(
            item =>
                item.id === chat.id
        );


    if(index === -1){
        return;
    }


    chats[index] =
        chat;


    saveChats(chats);

}


/* =========================
   DELETE ALL HISTORY
========================= */

function deleteAllHistory(){

    localStorage.removeItem(
        CHATS_KEY
    );

    currentChatId =
        null;

    renderHistory();

    showWelcome();

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

    const chats =
        getChats();


    history.innerHTML =
        "";


    historyCount.textContent =
        chats.length;


    if(chats.length === 0){

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "emptyHistory";

        empty.innerHTML =
            "अभी कोई chat नहीं है।<br>New Chat से शुरू करें।";

        history.appendChild(
            empty
        );

        return;

    }


    chats.forEach(
        function(chat){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "historyItem";


            if(
                chat.id ===
                currentChatId
            ){

                item.classList.add(
                    "active"
                );

            }


            const icon =
                document.createElement(
                    "span"
                );

            icon.className =
                "historyIcon";

            icon.textContent =
                "💬";


            const text =
                document.createElement(
                    "span"
                );

            text.className =
                "historyText";

            text.textContent =
                chat.title ||
                "New Chat";


            item.appendChild(
                icon
            );

            item.appendChild(
                text
            );


            item.addEventListener(
                "click",
                function(){

                    openChat(
                        chat.id
                    );

                    if(
                        window.innerWidth <=
                        800
                    ){

                        sidebar.classList.remove(
                            "open"
                        );

                    }

                }
            );


            history.appendChild(
                item
            );

        }
    );

}

   WELCOME
========================= */

/* =========================
   NEW CHAT
========================= */

function startNewChat(){

    const chat =
        createChat(
            "New Chat"
        );


    currentChatId =
        chat.id;


    showWelcome();

    renderHistory();


    messageInput.value =
        "";

    messageInput.style.height =
        "auto";


    hideImagePreview();


    messageInput.focus();

}


/* =========================
   OPEN CHAT
========================= */

function openChat(chatId){

    const chats =
        getChats();


    const chat =
        chats.find(
            item =>
                item.id ===
                chatId
        );


    if(!chat){
        return;
    }


    currentChatId =
        chatId;


    chatContainer.innerHTML =
        "";


    if(
        !chat.messages ||
        chat.messages.length === 0
    ){

        showWelcome();

    }else{

        chat.messages.forEach(
            function(message){

                renderMessage(
                    message.role,
                    message.content,
                    message.imageData,
                    message.createdAt,
                    false
                );

            }
        );

    }


    renderHistory();

    scrollBottom();

}


/* =========================
   SAVE MESSAGE
========================= */

function saveMessage(
    role,
    content,
    imageData = null
){

    let chat =
        getCurrentChat();


    if(!chat){

        chat =
            createChat(
                "New Chat"
            );

        currentChatId =
            chat.id;

    }


    if(
        role === "user" &&
        chat.messages.length === 0
    ){

        let title =
            (
                content ||
                "Image Chat"
            )
            .trim()
            .replace(/\s+/g," ")
            .slice(0,50);


        if(!title){
            title = "New Chat";
        }


        chat.title =
            title;

    }


    chat.messages.push({

        role:
            role,

        content:
            content || "",

        imageData:
            imageData || null,

        createdAt:
            Date.now()

    });


    chat.updatedAt =
        Date.now();


    updateChat(
        chat
    );


    renderHistory();

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(
    role,
    content,
    imageData = null,
    createdAt = Date.now(),
    shouldScroll = true
){

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "messageRow " +
        (
            role === "user"
                ? "user"
                : "ai"
        );


    /* AI AVATAR */

    if(role !== "user"){

        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "messageAvatar aiAvatar";

        avatar.textContent =
            "🤖";


        row.appendChild(
            avatar
        );

    }


    /* CONTENT */

    const contentBox =
        document.createElement(
            "div"
        );

    contentBox.className =
        "messageContent";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "messageBubble";

    bubble.textContent =
        content || "";


    contentBox.appendChild(
        bubble
    );


    /* IMAGE */

    if(imageData){

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "messageImage";

        img.src =
            imageData;

        img.alt =
            "Uploaded image";


        contentBox.appendChild(
            img
        );

    }


    /* TIME */

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "messageTime";

    time.textContent =
        new Date(
            createdAt ||
            Date.now()
        ).toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    contentBox.appendChild(
        time
    );


    row.appendChild(
        contentBox
    );


    /* USER AVATAR */

    if(role === "user"){

        const avatar =
            document.createElement(
                "img"
            );

        avatar.className =
            "messageAvatar";

        avatar.src =
            "/baatai-logo.png";

        avatar.alt =
            "You";


        row.appendChild(
            avatar
        );

    }


    chatContainer.appendChild(
        row
    );


    if(shouldScroll){

        scrollBottom();

    }

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

    setTimeout(
        function(){

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },
        20
    );

}


/* =========================
   TYPING
========================= */

function showTyping(){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "messageRow ai";

    row.id =
        "typingMessage";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "messageAvatar aiAvatar";

    avatar.textContent =
        "🤖";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "messageBubble";


    bubble.innerHTML =
        `

        <div class="typing">

            <span></span>
            <span></span>
            <span></span>

        </div>

        `;


    row.appendChild(
        avatar
    );

    row.appendChild(
        bubble
    );


    chatContainer.appendChild(
        row
    );


    scrollBottom();

}


function removeTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );


    if(typing){
        typing.remove();
    }

}


/* =========================
   API CONTEXT
========================= */

function getConversation(){

    const chat =
        getCurrentChat();


    if(
        !chat ||
        !chat.messages
    ){

        return [];

    }


    return chat.messages
        .slice(-20)
        .map(
            function(message){

                return {

                    role:
                        message.role === "user"
                            ? "user"
                            : "assistant",

                    content:
                        message.content || ""

                };

            }
        );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    if(isSending){
        return;
    }


    const text =
        messageInput.value.trim();


    if(
        !text &&
        !currentImage
    ){

        return;

    }


    /* CREATE CHAT */

    if(!currentChatId){

        const chat =
            createChat(
                "New Chat"
            );

        currentChatId =
            chat.id;

    }


    isSending =
        true;

    sendBtn.disabled =
        true;


    const userText =
        text;


    const userImage =
        currentImage;


    /* CLEAR INPUT */

    messageInput.value =
        "";

    messageInput.style.height =
        "auto";


    /* USER MESSAGE */

    renderMessage(
        "user",
        userText ||
            "Image भेजी गई है।",
        userImage
    );


    saveMessage(
        "user",
        userText ||
            "Image भेजी गई है।",
        userImage
    );


    hideImagePreview();


    /* TYPING */

    showTyping();


    try{

        const response =
            await fetch(
                API +
                "/api/chat",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                userText,

                            image:
                                userImage,

                            conversation:
                                getConversation()

                        })

                }
            );


        const raw =
            await response.text();


        let data = {};


        try{

            data =
                raw
                    ? JSON.parse(raw)
                    : {};

        }catch(error){

            throw new Error(
                "Server ने invalid response दिया।"
            );

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "AI response नहीं मिला।"
            );

        }


        const reply =
            data.reply ||
            data.message ||
            "मुझे कोई जवाब नहीं मिला।";


        removeTyping();


        renderMessage(
            "ai",
            reply
        );


        saveMessage(
            "assistant",
            reply
        );


    }catch(error){

        console.error(
            "BaatAI Error:",
            error
        );


        removeTyping();


        const errorMessage =
            "⚠️ BaatAI अभी response नहीं दे पाया।\n\n" +
            (
                error.message ||
                "कृपया थोड़ी देर बाद फिर कोशिश करें।"
            );


        renderMessage(
            "ai",
            errorMessage
        );


        saveMessage(
            "assistant",
            errorMessage
        );

    }finally{

        isSending =
            false;

        sendBtn.disabled =
            false;

        messageInput.focus();

    }

}


/* =========================
   SEND BUTTON
========================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER KEY
========================= */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   TEXTAREA AUTO SIZE
========================= */

messageInput.addEventListener(
    "input",
    function(){

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            ) +
            "px";

    }
);


/* =========================
   SUGGESTION
========================= */

function useSuggestion(text){

    messageInput.value =
        text;


    messageInput.dispatchEvent(
        new Event("input")
    );


    messageInput.focus();

}


/* =========================
   IMAGE PREVIEW
========================= */

function showImagePreview(data){

    currentImage =
        data;


    previewImage.src =
        data;


    imagePreview.classList.add(
        "show"
    );

}


function hideImagePreview(){

    currentImage =
        null;


    previewImage.src =
        "";


    imagePreview.classList.remove(
        "show"
    );


    imageInput.value =
        "";

}


/* =========================
   IMAGE BUTTON
========================= */

cameraBtn.addEventListener(
    "click",
    function(){

        imageInput.click();

    }
);


/* =========================
   IMAGE SELECT
========================= */

imageInput.addEventListener(
    "change",
    function(){

        const file =
            imageInput.files[0];


        if(!file){
            return;
        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "कृपया image file select करें।"
            );

            return;

        }


        if(
            file.size >
            12 * 1024 * 1024
        ){

            alert(
                "Image 12MB से छोटी रखें।"
            );

            imageInput.value =
                "";

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                showImagePreview(
                    event.target.result
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =========================
   REMOVE IMAGE
========================= */

removeImage.addEventListener(
    "click",
    hideImagePreview
);


/* =========================
   CLEAR HISTORY
========================= */

clearHistoryBtn.addEventListener(
    "click",
    function(){

        const chats =
            getChats();


        if(chats.length === 0){

            alert(
                "अभी कोई chat history नहीं है।"
            );

            return;

        }


        const confirmed =
            confirm(
                "क्या आप सभी Chat History delete करना चाहते हैं?"
            );


        if(!confirmed){
            return;
        }


        deleteAllHistory();

    }
);


/* =========================
   NEW CHAT BUTTON
========================= */

newChatBtn.addEventListener(
    "click",
    function(){

        startNewChat();


        if(
            window.innerWidth <=
            800
        ){

            sidebar.classList.remove(
                "open"
            );

        }

    }
);


/* =========================
   THEME
========================= */

function updateThemeButton(){

    const isLight =
        document.body.classList.contains(
            "light"
        );


    if(isLight){

        themeIcon.textContent =
            "☀️";

        themeText.textContent =
            "Dark Mode";

    }else{

        themeIcon.textContent =
            "🌙";

        themeText.textContent =
            "Light Mode";

    }

}


themeBtn.addEventListener(
    "click",
    function(){

        document.body.classList.toggle(
            "light"
        );


        const isLight =
            document.body.classList.contains(
                "light"
            );


        localStorage.setItem(
            THEME_KEY,
            isLight
                ? "light"
                : "dark"
        );


        updateThemeButton();

    }
);


/* =========================
   LOAD THEME
========================= */

function loadTheme(){

    const theme =
        localStorage.getItem(
            THEME_KEY
        );


    if(theme === "light"){

        document.body.classList.add(
            "light"
        );

    }


    updateThemeButton();

}


/* =========================
   MOBILE MENU
========================= */

menuBtn.addEventListener(
    "click",
    function(){

        sidebar.classList.toggle(
            "open"
        );

    }
);


/* =========================
   CLOSE SIDEBAR OUTSIDE
========================= */

document.addEventListener(
    "click",
    function(event){

        if(
            window.innerWidth > 800
        ){
            return;
        }


        if(
            !sidebar.classList.contains(
                "open"
            )
        ){
            return;
        }


        const clickedInside =
            sidebar.contains(
                event.target
            );


        const clickedMenu =
            menuBtn.contains(
                event.target
            );


        if(
            !clickedInside &&
            !clickedMenu
        ){

            sidebar.classList.remove(
                "open"
            );

        }

    }
);


/* =========================
   STARTUP
========================= */

function initializeBaatAI(){

    loadTheme();

    renderHistory();


    const chats =
        getChats();


    if(chats.length > 0){

        /*
         सबसे recent chat खोलें
        */

        currentChatId =
            chats[0].id;


        openChat(
            currentChatId
        );

    }else{

        /*
         पहली बार Welcome दिखाएं
        */

        showWelcome();

    }

}


initializeBaatAI();
